name: LITTLE DAY CAFE — deploy (GitHub Pages, demo mode)

on:
  push:
    branches: [claude/cafe-app-qr-code-fp5krg]
    paths: [little-day-cafe/**, .github/workflows/little-day-cafe-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: little-day-cafe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: little-day-cafe/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run typecheck
      - name: Build (base path = repo name, auto-follows renames)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: little-day-cafe/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
