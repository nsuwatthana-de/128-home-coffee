<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เต่าน้อยคอยจดเงิน</title>
<link rel="icon" href="apple-touch-icon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="เต่าน้อยคอยจดเงิน"><meta name="theme-color" content="#1F78D1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF6FF;--card:#fff;--ink:#12304F;--mute:#5F7C9A;--line:#D6E6F7;--in:#0A8F63;--out:#E0454F;--acc:#12304F;--accfg:#fff;--chip:#E3F0FF;--hero:#1F78D1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A2B;--card:#13283F;--ink:#E9F2FC;--mute:#93ADC8;--line:#23405E;--in:#4FDDAF;--out:#FF7C86;--acc:#E9F2FC;--accfg:#0B1A2B;--chip:#1B3552;--hero:#1A5FA8}}
:root[data-theme="dark"]{--bg:#0B1A2B;--card:#13283F;--ink:#E9F2FC;--mute:#93ADC8;--line:#23405E;--in:#4FDDAF;--out:#FF7C86;--acc:#E9F2FC;--accfg:#0B1A2B;--chip:#1B3552;--hero:#1A5FA8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Noto Sans Thai",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 110px}
section{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}
button{font:inherit;color:var(--ink);cursor:pointer;border:0;background:transparent;border-radius:12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.seg{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:14px;margin-bottom:12px}
.seg button{flex:1;padding:9px 0}.seg .on{background:var(--acc);color:var(--accfg);font-weight:500}
.nav{display:flex;align-items:center;justify-content:space-between}.nav button{padding:6px 16px;font-size:20px;background:var(--chip)}
.nav b{font-size:16px}
.net{font-size:42px;font-weight:700;letter-spacing:-1px;margin:6px 0 8px}
.two{display:flex;gap:10px}.two div{flex:1;border-top:3px solid;padding-top:6px}.two small{display:block;color:var(--mute)}.two strong{font-size:19px}
.in{color:var(--in)}.out{color:var(--out)}
.cat{margin-bottom:10px}.cat>div:first-child{display:flex;justify-content:space-between}
.bar{height:8px;border-radius:4px;background:var(--chip);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--out);border-radius:4px}
.dh{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;padding:10px 0 4px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0}
.ic{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:19px;flex:none}
.grow{flex:1;min-width:0}.grow small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;white-space:nowrap}.x{color:var(--mute);padding:6px 10px}.x.arm{background:var(--out);color:#fff}
.empty{color:var(--mute);text-align:center;padding:16px 0}
#fabs{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;padding:0 14px}
#fabs button{flex:1;max-width:210px;color:#fff;font-weight:700;font-size:16px;padding:14px 0;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#fin{background:#0E9F6E}#fout{background:#E5484D}
.av{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:10px 12px;background:var(--chip);border-radius:12px}.av strong{font-size:20px}
.av2{margin-top:8px;padding:0 2px;font-size:14px}.av2 .bar i{background:var(--in)}.av2 .bar.o i{background:var(--out)}

#ov,#ov2{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#ov[hidden],#ov2[hidden],#newc[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.tg{display:flex;gap:6px;margin-bottom:12px}.tg button{flex:1;padding:11px 0;background:var(--chip);font-weight:500}
.tg .on.o{background:var(--out);color:#fff}.tg .on.i{background:var(--in);color:#fff}
.amtw{display:flex;align-items:center;gap:6px;font-size:40px;font-weight:700;margin-bottom:12px}
.amtw input{flex:1;min-width:0;font:inherit;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);padding:0 4px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chips button{background:var(--chip);padding:10px 4px;font-size:13px;line-height:1.3;border:2px solid transparent}
.chips button span{display:block;font-size:22px}
.chips .on{border-color:var(--ink);font-weight:700}
.f{display:flex;gap:8px;margin-bottom:12px}
.f input{font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:9px;min-width:0}
#note{flex:1}
#top{display:flex;justify-content:flex-end;margin-bottom:6px}#top button{background:var(--chip);padding:6px 12px;font-size:13px}
.alert{background:color-mix(in srgb,var(--out) 14%,var(--card));border-left:4px solid var(--out);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.bud{display:flex;align-items:center;gap:8px;padding:5px 0}.bud span{flex:1}.bud input,#bk,#ncname{font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;min-width:0}.bud input{width:110px;text-align:right}
#bk{width:100%;margin:8px 0}.sb{background:var(--chip);padding:10px 14px;margin-right:6px}
#err{color:var(--out);min-height:20px;font-size:13px}
#save{width:100%;padding:14px;background:var(--acc);color:var(--accfg);font-weight:700;font-size:16px}

section{border-radius:22px}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
header img{width:48px;height:48px;border-radius:14px}
header div{flex:1}header b{display:block;font-size:18px;line-height:1.2}header small{color:var(--mute)}
header button{background:var(--chip);padding:8px 12px;font-size:13px}
#mascot{background:var(--card);border-radius:18px 18px 18px 4px;padding:10px 14px;margin:0 0 12px 8px;font-size:14px;box-shadow:0 2px 0 var(--line)}
#hero{background:var(--hero);color:#fff}
#hero .seg{background:rgba(255,255,255,.22)}#hero .seg button{color:#fff}#hero .seg .on{background:#fff;color:#12304F}
#hero .nav button{background:rgba(255,255,255,.22);color:#fff}
#hero .net,#hero .two strong{color:#fff!important}#hero .two small{color:rgba(255,255,255,.85)}#hero .two div{border-color:rgba(255,255,255,.55)!important}
#hero .av{background:rgba(255,255,255,.2)}#hero .av strong{color:#fff!important}
#hero .av2 .bar{background:rgba(255,255,255,.3)}#hero .av2 .bar i{background:#fff}#hero .av2 .bar.o i{background:#FFE066}#hero .av2 b{color:#fff!important}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.quick button{background:var(--chip);padding:7px 12px;font-size:13px;border-radius:20px}
.chips button{border-radius:16px}.chips .on{background:var(--card);border-color:var(--hero)}
.sheet{border-radius:26px 26px 0 0}.amtw input{border-bottom-color:var(--hero)}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--acc);color:var(--accfg);padding:10px 20px;border-radius:24px;font-weight:500;z-index:9;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){#toast{animation:pop .25s ease-out}@keyframes pop{from{transform:translate(-50%,-14px);opacity:0}}}
</style>
</head>

function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
$('quick').onclick=e=>{const q=e.target.dataset.q;if(q==null)return;$('amt').value=q==='0'?'':(parseFloat($('amt').value.replace(/,/g,''))||0)+ +q};
let CX={out:[],in:[]},BUD={},SET={bal:0,mb:0},tx=[],mode='m',anchor=fmt(new Date()),type='out',cat=null,armed=null;
try{tx=JSON.parse(localStorage.getItem('mm-tx')||'[]')}catch(e){tx=[]}
try{CX=JSON.parse(localStorage.getItem('mm-cats'))||CX;BUD=JSON.parse(localStorage.getItem('mm-bud'))||{};SET=JSON.parse(localStorage.getItem('mm-set'))||SET}catch(e){}
const save=()=>{try{localStorage.setItem('mm-tx',JSON.stringify(tx));localStorage.setItem('mm-cats',JSON.stringify(CX));localStorage.setItem('mm-bud',JSON.stringify(BUD));localStorage.setItem('mm-set',JSON.stringify(SET))}catch(e){}};
const cats=t=>C[t].filter(x=>x[1]!=='อื่นๆ').concat(CX[t],[C[t].find(x=>x[1]==='อื่นๆ')]);

function range(){
  const [y,m,d]=anchor.split('-').map(Number);
  if(mode==='d')return [anchor,anchor];
  if(mode==='w'){const k=(new Date(y,m-1,d).getDay()+6)%7;return [fmt(new Date(y,m-1,d-k)),fmt(new Date(y,m-1,d-k+6))]}
  return [fmt(new Date(y,m-1,1)),fmt(new Date(y,m,0))];
}
function shift(n){const [y,m,d]=anchor.split('-').map(Number);anchor=fmt(mode==='d'?new Date(y,m-1,d+n):mode==='w'?new Date(y,m-1,d+7*n):new Date(y,m-1+n,1));render()}
function dayName(s){const t=fmt(new Date()),y=fmt(new Date(Date.now()-864e5));return s===t?'วันนี้':s===y?'เมื่อวาน':th(s,{weekday:'short',day:'numeric',month:'short'})}

function render(){
  const [lo,hi]=range();
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  $('lab').textContent=mode==='d'?dayName(lo):mode==='w'?th(lo,{day:'numeric',month:'short'})+' – '+th(hi,{day:'numeric',month:'short'}):th(lo,{month:'long',year:'numeric'});
  const L=tx.filter(t=>t.date>=lo&&t.date<=hi).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const sum=k=>L.filter(t=>t.type===k).reduce((s,t)=>s+t.amount,0),inc=sum('in'),exp=sum('out'),net=inc-exp;
  $('inc').textContent=baht(inc);$('exp').textContent=baht(exp);
  $('net').textContent=(net<0?'−':'')+baht(Math.abs(net));$('net').className='net '+(net<0?'out':'in');
  const by={};L.filter(t=>t.type==='out').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const E=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $('cats').innerHTML=E.length?E.map(([c,v])=>`<div class="cat"><div><span>${icon('out',c)} ${c}</span><span>${baht(v)} <span style="color:var(--mute)">${Math.round(v/exp*100)}%${mode==='m'&&BUD[c]?' · งบ '+baht(BUD[c]):''}</span></span></div><div class="bar"><i style="width:${v/E[0][1]*100}%"></i></div></div>`).join(''):'<div class="empty">🐢 ช่วงนี้ยังไม่มีเงินออก</div>';
  const mk=anchor.slice(0,7),ms={};
  tx.filter(t=>t.type==='out'&&t.date.startsWith(mk)).forEach(t=>ms[t.cat]=(ms[t.cat]||0)+t.amount);
  const al=Object.entries(BUD).filter(([c,b])=>b>0&&(ms[c]||0)>=b*.8).map(([c,b])=>{const p=Math.round((ms[c]||0)/b*100);return `${icon('out',c)} ${c}: ${p>=100?'เกินงบแล้ว':'ใช้ไป'} ${p}% (${baht(ms[c])} จาก ${baht(b)})`});
  $('alerts').innerHTML=al.length?`<div class="alert"><b>งบเดือน ${th(mk+'-01',{month:'long'})}</b><br>${al.join('<br>')}</div>`:'';
  const bal=(SET.bal||0)+tx.reduce((s,t)=>s+(t.type==='in'?t.amount:-t.amount),0);
  let av=`<div class="av"><span>เงินที่มีอยู่ตอนนี้</span><strong class="${bal<0?'out':''}">${bal<0?'−':''}${baht(Math.abs(bal))}</strong></div>`;
  if(SET.mb>0){const sp=Object.values(ms).reduce((a,b)=>a+b,0),rem=SET.mb-sp,now=new Date(),cur=mk===fmt(now).slice(0,7),[yy,mm]=mk.split('-').map(Number),left=cur?new Date(yy,mm,0).getDate()-now.getDate()+1:0;
    av+=`<div class="av2">งบเดือน ${th(mk+'-01',{month:'long'})}: ${rem<0?'<b class="out">เกินงบ '+baht(-rem)+'</b>':'เหลือ <b>'+baht(rem)+'</b> จาก '+baht(SET.mb)}${cur&&rem>0?' · ใช้ได้วันละ <b>'+baht(rem/left)+'</b>':''}<div class="bar${rem<0||sp>=SET.mb*.8?' o':''}"><i style="width:${Math.min(100,sp/SET.mb*100)}%"></i></div></div>`}
  $('avail').innerHTML=av;
  const tds=fmt(new Date()),mm_=!tx.length?'สวัสดี! กด "เงินออก" หรือ "เงินเข้า" ด้านล่างเพื่อจดรายการแรกกันเลย 🐢':al.some(x=>x.includes('เกินงบ'))?'ว้าย! มีหมวดที่เกินงบแล้วนะ ลองดูกล่องสีแดงด้านล่าง 😳':al.length?'ใกล้ถึงงบแล้วนะ ค่อยๆ ใช้นะ 🐢':!tx.some(t=>t.date===tds)?'วันนี้ยังไม่ได้จดเลย อย่าลืมนะ 📝':'เก่งมาก! วันนี้จดแล้ว ✨';
  $('mascot').textContent=mm_;
  let h='',last='';
  L.forEach(t=>{
    if(t.date!==last){last=t.date;const d=L.filter(x=>x.date===t.date).reduce((s,x)=>s+(x.type==='in'?x.amount:-x.amount),0);
      h+=`<div class="dh"><span>${dayName(t.date)}</span><span>${d<0?'−':'+'}${baht(Math.abs(d))}</span></div>`}
    h+=`<div class="row"><div class="ic">${icon(t.type,t.cat)}</div><div class="grow"><div>${t.cat}</div>${t.note?`<small>${esc(t.note)}</small>`:''}</div><span class="amt ${t.type==='in'?'in':'out'}">${t.type==='in'?'+':'−'}${baht(t.amount)}</span><button class="x${armed===t.id?' arm':''}" data-del="${t.id}" aria-label="ลบรายการ">${armed===t.id?'ลบ?':'✕'}</button></div>`});
  $('list').innerHTML=h||'<div class="empty">🐢 ยังไม่มีรายการ กดปุ่มด้านล่างเพื่อจดรายการแรก</div>';
}
function chips(){$('chips').innerHTML=cats(type).map(([e,n])=>`<button data-c="${n}" class="${cat===n?'on':''}"><span>${e}</span>${n}</button>`).join('')+'<button data-addcat="1"><span>＋</span>เพิ่มหมวดเอง</button>'}
function open(t){$('newc').hidden=true;$('ncname').value='';type=t;cat=null;$('amt').value='';$('note').value='';$('dt').value=fmt(new Date());$('err').textContent='';setType();$('ov').hidden=false;setTimeout(()=>$('amt').focus(),50)}
function setType(){document.querySelectorAll('#tg button').forEach(b=>{const on=b.dataset.t===type;b.className=on?'on '+(type==='out'?'o':'i'):''});chips()}
$('fin').onclick=()=>open('in');$('fout').onclick=()=>open('out');$('close').onclick=()=>$('ov').hidden=true;
$('ov').onclick=e=>{if(e.target.id==='ov')$('ov').hidden=true};
$('tg').onclick=e=>{if(e.target.dataset.t){type=e.target.dataset.t;cat=null;setType()}};
$('chips').onclick=e=>{if(e.target.closest('[data-addcat]')){$('newc').hidden=false;$('ncname').focus();return}const b=e.target.closest('[data-c]');if(b){cat=b.dataset.c;chips()}};
$('save').onclick=()=>{
  const a=parseFloat($('amt').value.replace(/,/g,''));
  if(!(a>0)){$('err').textContent='ใส่จำนวนเงินก่อน';return}
  if(!cat){$('err').textContent='เลือกหมวดว่าเป็นค่าอะไร';return}
  const date=$('dt').value||fmt(new Date());
  tx.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),type,cat,amount:a,date,note:$('note').value.trim()});
  save();anchor=date;$('ov').hidden=true;render();toast(type==='in'?'เก็บเงินเข้ากระปุกแล้ว 🐢':'จดเรียบร้อย ✓');
};
$('list').onclick=e=>{const id=e.target.dataset.del;if(!id)return;
  if(armed===id){tx=tx.filter(t=>t.id!==id);armed=null;save()}else armed=id;render()};
$('seg').onclick=e=>{if(e.target.dataset.m){mode=e.target.dataset.m;render()}};
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);
$('ncok').onclick=()=>{const n=$('ncname').value.trim();if(!n)return;
  if(!cats(type).some(x=>x[1]===n)){CX[type].push(['🔖',n]);save()}
  cat=n;$('newc').hidden=true;$('ncname').value='';chips()};
function budUI(){$('bud').innerHTML=cats('out').filter(x=>x[1]!=='อื่นๆ').map(([e,n])=>`<div class="bud"><span>${e} ${n}</span><input inputmode="decimal" data-b="${esc(n)}" value="${BUD[n]||''}" placeholder="ไม่ตั้ง" aria-label="งบ ${esc(n)}"></div>`).join('')}
$('gear').onclick=()=>{$('setbal').value=SET.bal||'';$('setmb').value=SET.mb||'';budUI();$('bmsg').textContent='';$('ov2').hidden=false};
$('close2').onclick=()=>{$('ov2').hidden=true;render()};
$('ov2').onclick=e=>{if(e.target.id==='ov2'){$('ov2').hidden=true;render()}};
['setbal','setmb'].forEach(id=>$(id).addEventListener('input',e=>{const v=parseFloat(e.target.value.replace(/,/g,''));SET[id==='setbal'?'bal':'mb']=isFinite(v)?v:0;save()}));
$('bud').addEventListener('input',e=>{const n=e.target.dataset.b;if(!n)return;const v=parseFloat(e.target.value.replace(/,/g,''));
  if(v>0)BUD[n]=v;else delete BUD[n];save()});
$('bkcopy').onclick=async()=>{
  const t=JSON.stringify({v:1,tx,CX,BUD,SET});$('bk').value=t;$('bk').select();
  try{await navigator.clipboard.writeText(t);$('bmsg').textContent='คัดลอกแล้ว นำไปวางเก็บไว้ในโน้ตได้เลย'}
  catch(e){$('bmsg').textContent='คัดลอกอัตโนมัติไม่ได้ กดค้างที่ข้อความด้านบนแล้วเลือก คัดลอก'}};
$('bkload').onclick=()=>{
  try{const d=JSON.parse($('bk').value);if(!Array.isArray(d.tx))throw 0;
    const ids=new Set(tx.map(t=>t.id));let n=0;d.tx.forEach(t=>{if(t&&t.id&&t.amount>0&&!ids.has(t.id)){tx.push(t);n++}});
    ['out','in'].forEach(k=>((d.CX||{})[k]||[]).forEach(c=>{if(!CX[k].some(x=>x[1]===c[1]))CX[k].push(c)}));
    Object.assign(BUD,d.BUD||{});Object.assign(SET,d.SET||{});save();budUI();render();$('bmsg').textContent=`นำเข้าแล้ว ${n} รายการใหม่`}
  catch(e){$('bmsg').textContent='อ่านข้อความสำรองไม่ได้ ตรวจว่าวางครบทั้งก้อน'}};
render();
</script>
</body>
</html>
